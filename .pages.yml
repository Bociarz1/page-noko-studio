media:
  - name: blog
    input: src/assets/blog
    output: /src/assets/blog
  - name: portfolio
    input: src/assets/portfolio
    output: /src/assets/portfolio
  - name: authors
    input: src/assets/authors
    output: /src/assets/authors

content:
  - name: blog
    label: Blog (Artykuły)
    type: collection
    path: src/content/blog
    filename: '{slug}.md'
    view:
      sort: [pubDate, title]
      default:
        sort: pubDate
        order: desc
    fields:
      - name: title
        label: Główny Tytuł (H1)
        type: string
        description: 'Główny tytuł wyświetlany na samej górze artykułu. Może być nieco dłuższy.'
        required: true
      - name: slug
        label: Custom URL Slug
        type: string
        description: 'Własny adres URL (np. "super-wpis"). Jeśli puste, użyta zostanie nazwa pliku.'
        required: true
      - name: metaTitle
        label: Tytuł SEO (Meta Title)
        type: string
        description: 'Tytuł, który wyświetla się w zakładce przeglądarki i w Google (do 65 znaków). Jeśli zostawisz puste, użyty zostanie Główny Tytuł.'
        required: true
      - name: metaDescription
        label: Opis SEO (Meta Description)
        type: string
        description: 'Krótkie streszczenie pod SEO w Google (150-160 znaków). Jeśli zostawisz puste, użyty zostanie Opis (Zajawka).'
        required: true
      - name: description
        label: Opis / Zajawka (Hero Section)
        type: string
        description: 'Tekst, który będzie widoczny na górze strony we wstępie (w Hero Section).'
        required: true
      - name: pubDate
        label: Data publikacji
        type: date
        description: 'Data, od której artykuł jest widoczny.'
        required: true
      - name: updatedDate
        label: Data aktualizacji
        type: date
        description: '(Opcjonalnie) Data ostatniej edycji artykułu.'
      - name: author
        label: Autor
        type: select
        description: 'Wybierz autora, który wyświetli się pod tytułem.'
        options:
          values:
            - aleksandra
            - paulina
      - name: image
        label: Okładka wpisu
        type: image
        options:
          media: blog
        description: 'Główne zdjęcie artykułu (najlepiej poziome).'
        required: true
      - name: articleCategory
        label: Kategoria (Wybierz z listy)
        type: reference
        list: true
        description: 'Wybierz kategorię z dostępnych.'
        options:
          collection: articleCategories
          search: [name]
          label: '{name}'
      - name: faq
        label: Sekcja FAQ (Pytania i Odpowiedzi)
        type: object
        list: true
        description: 'Sekcja Pytań i Odpowiedzi widoczna na samym dole artykułu (dobra pod SEO).'
        fields:
          - name: q
            label: Pytanie
            type: string
            description: 'Krótkie pytanie (np. Jak wybrać łóżko?).'
            required: true
          - name: a
            label: Odpowiedź
            type: rich-text
            description: 'Odpowiedź na pytanie.'
            required: true
      - name: body
        label: Treść artykułu
        type: rich-text
        options:
          media: blog
        description: 'Główna treść artykułu. Możesz dodawać akapity, listy i pogrubienia.'

  - name: portfolio
    label: Portfolio
    type: collection
    path: src/content/portfolio
    filename: '{slug}.md'
    view:
      sort: [pubDate, title]
      default:
        sort: pubDate
        order: desc
    fields:
      - name: title
        label: Tytuł projektu (H1)
        type: string
        description: 'Pełna nazwa projektu wyświetlana na stronie (oraz jako tytuł SEO, jeśli nie podano innego).'
        required: true
      - name: slug
        label: Custom URL Slug
        type: string
        description: 'Własny adres URL (np. "super-projekt"). Jeśli puste, użyta zostanie nazwa pliku.'
        required: true
      - name: metaTitle
        label: Tytuł SEO (Meta Title)
        type: string
        description: 'Tytuł, który wyświetla się w zakładce przeglądarki i w Google (do 65 znaków). Jeśli zostawisz puste, użyty zostanie Tytuł projektu.'
        required: true
      - name: metaDescription
        label: Opis SEO (Meta Description)
        type: string
        description: 'Krótkie streszczenie pod SEO w Google. Jeśli zostawisz puste, Google użyje pierwszych zdań strony.'
        required: true
      - name: description
        label: Krótki opis (Hero Section)
        type: string
        description: 'Tekst wyświetlający się na samej górze podstrony projektu.'
        required: true
      - name: location
        label: Lokalizacja
        type: string
        description: 'Gdzie zrealizowano projekt (np. Warszawa).'
        required: true
      - name: pubDate
        label: Data publikacji (określa też rok projektu)
        type: date
        description: 'Sortowanie w portfolio od najnowszych.'
        required: true
      - name: featured
        label: Wyróżniony projekt
        type: boolean
        description: 'Zaznacz to, aby projekt wyświetlił się na Stronie Głównej.'
      - name: category
        label: Kategoria
        type: select
        description: 'Wybierz typ nieruchomości.'
        options:
          values:
            - apartament
            - mieszkanie
            - dom
        required: true
      - name: area
        label: Powierzchnia
        type: string
        description: 'Metraż projektu (np. 100m²).'
        required: true
      - name: cover
        label: Zdjęcie główne (Okładka)
        type: image
        options:
          media: portfolio
        description: 'Miniatura widoczna na liście projektów.'
        required: true
      - name: gallery
        label: Galeria zdjęć projektu
        type: object
        list: true
        description: 'Dodaj kolejne zdjęcia do galerii na podstronie.'
        fields:
          - name: src
            label: Plik zdjęcia
            type: image
            options:
              media: portfolio
            required: true
          - name: alt
            label: Tekst alternatywny (Alt)
            type: string
            description: 'Opis dla niewidomych i wyszukiwarki (np. "Jasny salon z narożnikiem").'
            required: true

  - name: authors
    label: Autorzy
    type: collection
    path: src/content/authors
    fields:
      - name: name
        label: Imię i Nazwisko
        type: string
        description: 'Imię i nazwisko autora.'
        required: true
      - name: description
        label: Krótki biogram
        type: string
        description: 'Zwięzły opis na 1-2 zdania.'
        required: true
      - name: avatar
        label: Zdjęcie profilowe
        type: image
        options:
          media: authors
        description: 'Zdjęcie awatara.'
        required: true

  - name: articleCategories
    label: Kategorie Bloga
    type: collection
    path: src/content/articleCategories
    fields:
      - name: name
        label: Nazwa kategorii
        type: string
        description: 'Pojawi się na stronie (np. Wnętrza).'
        required: true
      - name: description
        label: Opis kategorii
        type: string
        description: 'Krótki opis SEO dla podstrony kategorii (np. do 160 znaków).'
        required: false
